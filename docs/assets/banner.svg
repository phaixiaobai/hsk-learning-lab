  <rect x="878" y="164" width="102" height="28" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="929" y="183" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">✍️ Writing Test</text>
  <rect x="989" y="164" width="86" height="28" rx="10" fill="#fdf4ff" stroke="#f0abfc" stroke-width="1.5"/>
  <text x="1032" y="183" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#a21caf" text-anchor="middle">🎲 Mix Quiz</text>

  <!-- Card 3: Writing mock -->
  <rect x="620" y="230" width="220" height="140" rx="20" fill="white" filter="url(#cardshadow)"/>
  <rect x="620" y="230" width="220" height="140" rx="20" fill="white" stroke="#f3f4f6" stroke-width="1"/>
  <text x="650" y="258" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#6b7280">✍️ WRITING PAD</text>
  <rect x="650" y="268" width="80" height="80" rx="12" fill="white" stroke="#fecaca" stroke-width="2.5"/>
  <!-- Stroke lines -->
  <line x1="690" y1="268" x2="690" y2="348" stroke="#f0f0f0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="650" y1="308" x2="730" y2="308" stroke="#f0f0f0" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="690" y="322" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',serif" font-size="44" font-weight="400" fill="#c1272d" text-anchor="middle" opacity="0.85">把</text>
  <!-- Buttons -->
  <rect x="740" y="268" width="82" height="24" rx="8" fill="#c1272d"/>
  <text x="781" y="284" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="600" fill="white" text-anchor="middle">▶ Animate</text>
  <rect x="740" y="300" width="82" height="24" rx="8" fill="white" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="781" y="316" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="600" fill="#374151" text-anchor="middle">✏️ Quiz Mode</text>
  <rect x="740" y="332" width="82" height="24" rx="8" fill="white" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="781" y="348" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="600" fill="#374151" text-anchor="middle">Hide Outline</text>

  <!-- Card 4: Vocab mock -->
  <rect x="858" y="230" width="260" height="140" rx="20" fill="white" filter="url(#cardshadow)"/>
  <rect x="858" y="230" width="260" height="140" rx="20" fill="white" stroke="#f3f4f6" stroke-width="1"/>
  <text x="888" y="258" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#6b7280">🗂️ VOCAB BROWSER · 656 WORDS</text>
  <!-- Section cards -->
  <rect x="878" y="268" width="72" height="56" rx="12" fill="#22c55e"/>
  <text x="914" y="287" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="800" fill="white" text-anchor="middle">HSK 2</text>
  <text x="914" y="302" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9" fill="white" text-anchor="middle" opacity="0.85">175 Words</text>
  <text x="914" y="316" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="8" fill="white" text-anchor="middle" opacity="0.75">20 sections</text>

  <rect x="958" y="268" width="72" height="56" rx="12" fill="#3b82f6"/>
  <text x="994" y="287" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="800" fill="white" text-anchor="middle">HSK 3</text>
  <text x="994" y="302" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9" fill="white" text-anchor="middle" opacity="0.85">187 Words</text>
  <text x="994" y="316" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="8" fill="white" text-anchor="middle" opacity="0.75">24 sections</text>

  <rect x="1038" y="268" width="72" height="56" rx="12" fill="#8b5cf6"/>
  <text x="1074" y="287" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="800" fill="white" text-anchor="middle">HSK 4</text>
  <text x="1074" y="302" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9" fill="white" text-anchor="middle" opacity="0.85">294 Words</text>
  <text x="1074" y="316" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="8" fill="white" text-anchor="middle" opacity="0.75">24 sections</text>

  <!-- Stat row -->
  <text x="878" y="348" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#6b7280">HSK 2 · 3 · 4  ·  20 sections  ·  English + Thai</text>

  <!-- Bottom accent line -->
  <rect x="0" y="396" width="1200" height="4" fill="url(#card)" opacity="0.6"/>
