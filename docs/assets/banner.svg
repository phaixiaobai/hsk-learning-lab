  <rect x="878" y="127" width="86" height="28" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
  <text x="921" y="146" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#d97706" text-anchor="middle">✏️ Fill Blank</text>
  <rect x="973" y="127" width="80" height="28" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
