<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fff0ee;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c1272d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8d1b20;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#c1272d" flood-opacity="0.2"/>
    </filter>
    <filter id="cardshadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#c1272d" stroke-width="0.3" opacity="0.15"/>
  </pattern>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Left section: branding -->
  <!-- Logo badge -->
  <rect x="80" y="100" width="90" height="90" rx="24" fill="url(#card)" filter="url(#shadow)"/>
  <text x="125" y="163" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',serif" font-size="52" font-weight="900" fill="white" text-anchor="middle">汉</text>

  <!-- App name -->
  <text x="192" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="42" font-weight="800" fill="#1a1a1a" letter-spacing="-1">HSK Lab</text>
  <text x="192" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="400" fill="#6b7280">Mandarin Learning Platform · HSK 2 · 3 · 4</text>

  <!-- Divider -->
  <line x1="80" y1="220" x2="540" y2="220" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- Feature pills -->
  <!-- Pill 1 -->
  <rect x="80" y="242" width="118" height="32" rx="16" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="139" y="263" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#c1272d" text-anchor="middle">🗂️ Vocab Browser</text>

  <!-- Pill 2 -->
  <rect x="208" y="242" width="106" height="32" rx="16" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="261" y="263" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#16a34a" text-anchor="middle">🎴 Flashcards</text>

  <!-- Pill 3 -->
  <rect x="324" y="242" width="86" height="32" rx="16" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
  <text x="367" y="263" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#d97706" text-anchor="middle">✍️ Writing</text>

  <!-- Pill 4 -->
  <rect x="420" y="242" width="70" height="32" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="455" y="263" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#2563eb" text-anchor="middle">🧩 Quiz</text>

  <!-- Pill 5 -->
  <rect x="80" y="284" width="86" height="32" rx="16" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="123" y="305" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#7c3aed" text-anchor="middle">🎤 Voice Quiz</text>

  <!-- Pill 6 -->
  <rect x="176" y="284" width="120" height="32" rx="16" fill="#fdf4ff" stroke="#f0abfc" stroke-width="1.5"/>
  <text x="236" y="305" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#a21caf" text-anchor="middle">📈 Performance</text>

  <!-- Pill 7 -->
  <rect x="306" y="284" width="110" height="32" rx="16" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="361" y="305" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#ea580c" text-anchor="middle">🎯 Your Level</text>

  <!-- Tech stack badges -->
  <text x="80" y="352" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="500" fill="#9ca3af">React 18</text>
  <text x="80" y="352" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#d1d5db">  ·  </text>
  <text x="138" y="352" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="500" fill="#9ca3af">TypeScript</text>
  <text x="212" y="352" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="500" fill="#9ca3af">· Vite · Tailwind · Supabase · Azure Neural TTS · PWA</text>

  <!-- Right section: mock UI cards -->
  <!-- Card 1: Flashcard mock -->
  <rect x="620" y="50" width="220" height="160" rx="20" fill="white" filter="url(#cardshadow)"/>
  <rect x="620" y="50" width="220" height="160" rx="20" fill="white" stroke="#f3f4f6" stroke-width="1"/>
  <text x="650" y="82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#6b7280">🎴 FLASHCARDS · HSK 2</text>
  <rect x="635" y="90" width="190" height="80" rx="14" fill="#fff5f5" stroke="#fecaca" stroke-width="1.5"/>
  <text x="730" y="142" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',serif" font-size="52" font-weight="700" fill="#1a1a1a" text-anchor="middle">把</text>
  <text x="730" y="165" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">Tap to reveal</text>
  <!-- Got It / Need Review buttons -->
  <rect x="635" y="185" width="88" height="14" rx="7" fill="#c1272d"/>
  <text x="679" y="195" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="8" font-weight="600" fill="white" text-anchor="middle">📌 Need Review</text>
  <rect x="729" y="185" width="96" height="14" rx="7" fill="#16a34a"/>
