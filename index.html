<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />

    <!--  ===========  iOS / iPadOS PWA meta tags  ===========
          These tags tell Safari that when the user chooses
          "Add to Home Screen" the site should run full-screen
          like a native app. Apple does not read manifest.json
          for this, so we duplicate the key hints here.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HSK Master" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />
    <meta name="theme-color" content="#c1272d" />

    <!-- PWA manifest (read by Chrome / Android / modern iPadOS) -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Chinese + Thai web-fonts for crisp rendering on iPad -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+SC:wght@400;700;900&family=Noto+Sans+Thai:wght@400;600;800&display=swap" rel="stylesheet" />

    <title>HSK Master — 2/3/4 Trainer</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
